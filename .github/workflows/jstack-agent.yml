name: jstack-agent
run-name: ${{ inputs.step }} step of ${{ inputs.issue }}, attempt ${{ inputs.attempt }} (${{ inputs.key }})
on:
  workflow_dispatch:
    inputs:
      step:
        required: true
      issue:
        required: true
      attempt:
        required: true
      key:
        required: true
      revision:
        required: true
      outcome:
        required: true
permissions: {}
jobs:
  agent:
    name: agent
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: end as the outcome says
        env:
          OUTCOME: ${{ inputs.outcome }}
        run: |
          case "$OUTCOME" in
            success) exit 0 ;;
            failure) exit 1 ;;
            hold) sleep 1700 ;;
            *) echo "unknown outcome $OUTCOME"; exit 2 ;;
          esac
